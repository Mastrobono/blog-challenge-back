services:
  - type: web
    name: nestjs-api
    env: node
    buildCommand: npm ci && npm run build && npx prisma migrate deploy --schema=./prisma/schema.prisma
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

